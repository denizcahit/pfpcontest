name = "fotopuan"
main = "worker.ts"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database Binding
# 1. Create your database: npx wrangler d1 create fotopuan-db
# 2. Paste the database_id below:
[[d1_databases]]
binding = "DB"
database_name = "fotopuan-db"
database_id = "fotopuan-db-placeholder"
