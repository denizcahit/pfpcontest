name = "fotopuan"
main = "worker.ts"
compatibility_date = "2024-09-23"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Veritabanı (İsteğe Bağlı):
# Cloudflare Dashboard'dan veya `npx wrangler d1 create fotopuan-db` ile 
# bir D1 veritabanı oluşturduğunuzda aşağıdaki 4 satırın başındaki (#) işaretini kaldırıp 
# aldığınız database_id'yi yapıştırabilirsiniz.
# 
# [[d1_databases]]
# binding = "DB"
# database_name = "fotopuan-db"
# database_id = "your-d1-database-uuid-here"
